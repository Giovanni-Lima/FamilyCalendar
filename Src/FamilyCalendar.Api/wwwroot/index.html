<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FamilyCalendar</title>

  <!-- PWA: app installabile (manifest + service worker, vedi sw.js) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FamilyCalendar">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Tema deciso PRIMA del CSS: niente lampo del tema sbagliato. Stesse regole di resolveTheme() nello script principale.
       ES5 di proposito: e' la prima cosa che gira e non deve poter fallire per sintassi. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("fc_theme"); } catch (e) {}
      if (t !== "light" && t !== "dark")
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "dark" ? "#1c1916" : "#ffffff");
    })();
  </script>

  <style>
    :root{
      color-scheme:light;
      /* accento */
      --orange:#ff9a1f; --orange-dark:#f08400; --orange-ink:#b35c00;   /* orange-ink: testo/contorni su bianco 4,7:1 */
      --on-accent:#fff; --on-accent-ink:#16181d; --accent-wash:#fff5e6;
      --peach:#fde9cc; --yellow:#f2c500;
      /* superfici */
      --page:#fdc98a; --surface:#fff; --surface-2:#fff; --surface-3:#fff; --deco:#eef0f2; --scrim:rgba(22,24,29,.35);
      /* testo */
      --ink:#16181d; --ink-soft:#4b5058; --muted:#8a8f98;
      /* linee e campi */
      --line:#e6e8ec; --rule:#d7dae0; --field-line:#d7dae0; --field-border:#e6e8ec; --field-bg:#fff; --control-line:#c9ccd3;
      --focus-ring:rgba(255,154,31,.25);
      /* errore */
      --danger:#e5484d; --danger-fill:#e5484d; --on-danger:#fff;
      --danger-wash:rgba(229,72,77,.08); --danger-line:rgba(229,72,77,.4);
      /* ombre */
      --shadow:0 8px 20px rgba(255,154,31,.38);
      --shadow-app:0 20px 50px rgba(120,60,0,.25);
      --shadow-btn:0 4px 14px rgba(0,0,0,.2);
      --shadow-pop:0 6px 18px rgba(0,0,0,.08);
      --shadow-pop-lg:0 14px 40px rgba(0,0,0,.25);
      --shadow-bar:0 -6px 16px rgba(0,0,0,.07);
      --shadow-danger:0 8px 20px rgba(229,72,77,.35);
      --map-filter:none;
    }
    /* Tema scuro: data-theme e' sempre impostato dallo script in <head> (anche quando segue il sistema),
       quindi non serve ripetere i valori in @media (prefers-color-scheme:dark). */
    :root[data-theme="dark"]{
      color-scheme:dark;
      --orange:#ff9a1f; --orange-dark:#ffb057; --orange-ink:#ffb057;
      --on-accent:#1f1305; --on-accent-ink:#1f1305; --accent-wash:#3b2915;
      --peach:#3d2b18; --yellow:#f2c500;
      --page:#2e1e0e; --surface:#1c1916; --surface-2:#26221e; --surface-3:#302b26; --deco:#25201b; --scrim:rgba(0,0,0,.6);
      --ink:#f4efe9; --ink-soft:#cdc4ba; --muted:#b0a69b;
      --line:#3a342e; --rule:#4a433c; --field-line:#7d736a; --field-border:#7d736a; --field-bg:#1c1916; --control-line:#857a70;
      --focus-ring:rgba(255,176,87,.35);
      --danger:#ff7b7f; --danger-fill:#d2373d; --on-danger:#fff;
      --danger-wash:rgba(255,123,127,.12); --danger-line:rgba(255,123,127,.45);
      --shadow:0 6px 16px rgba(0,0,0,.45);
      --shadow-app:0 0 0 1px #3a2a1a,0 20px 50px rgba(0,0,0,.6);
      --shadow-btn:0 0 0 1px #423b34,0 4px 14px rgba(0,0,0,.5);
      --shadow-pop:0 8px 24px rgba(0,0,0,.5);
      --shadow-pop-lg:0 0 0 1px #423b34,0 14px 40px rgba(0,0,0,.6);
      --shadow-bar:0 -1px 0 #3a342e,0 -8px 20px rgba(0,0,0,.35);
      --shadow-danger:0 6px 16px rgba(0,0,0,.45);
      --map-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.8);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0}
    body{background:var(--page);color:var(--ink);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex;justify-content:center;align-items:stretch}
    button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer}
    [hidden]{display:none!important}

    /* Sul telefono l'app occupa tutto lo schermo; su desktop è una "card" centrata. */
    .app{position:relative;width:100%;max-width:430px;height:100%;background:var(--surface);overflow:hidden;overflow:clip;   /* clip: niente area scrollabile, nemmeno via focus()/scrollIntoView (hidden resta come ripiego) */
      display:flex;flex-direction:column}
    @media (min-width:600px){
      body{padding:24px 0}
      .app{border-radius:28px;box-shadow:var(--shadow-app)}
    }
    /* Cerchio grigio decorativo in alto a destra, come nel mockup */
    .app::before{content:"";position:absolute;top:-170px;right:-140px;width:360px;height:360px;border-radius:50%;
      background:var(--deco);z-index:0;pointer-events:none}

    /* --- intestazione ---------------------------------------------------- */
    .top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;
      padding:calc(env(safe-area-inset-top) + 150px) 22px 0}
    .date-line{font-size:17px;letter-spacing:.01em;text-transform:uppercase}
    .today{color:var(--orange);font-weight:800;font-size:17px;letter-spacing:.02em;text-transform:uppercase;margin-top:2px}
    .icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;
      color:var(--ink);position:relative}
    .icon-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    /* --- striscia della settimana --------------------------------------- */
    .week-wrap{position:relative;z-index:1;margin:34px 0 0;padding:0 16px;display:flex;align-items:center;gap:4px}
    .week-nav{flex:0 0 auto;width:22px;height:44px;border:0;background:transparent;color:var(--orange);display:grid;place-items:center;padding:0}
    .week-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;touch-action:pan-y}
    .day{border:0;background:var(--peach);border-radius:10px;padding:8px 0 7px;display:flex;flex-direction:column;
      align-items:center;gap:3px;min-height:64px;transition:transform .12s}
    .day .dn{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
    .day .dd{font-size:19px;font-weight:800;line-height:1}
    .day .dots{display:flex;gap:3px;height:6px;align-items:center}
    .day .dots i{width:5px;height:5px;border-radius:50%;display:block}
    .day.sel{background:var(--orange);color:var(--on-accent);box-shadow:var(--shadow);transform:translateY(-2px)}
    .day.sel .dn{color:var(--on-accent)}
    .day.is-today:not(.sel) .dd{color:var(--orange-dark)}

    /* --- elenco attività (timeline) ------------------------------------- */
    .list{position:relative;z-index:1;flex:1;overflow-y:auto;padding:26px 20px 130px;-webkit-overflow-scrolling:touch}
    .item{position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:16px}
    .item::before{content:"";position:absolute;left:10px;top:24px;bottom:-4px;width:1px;background:var(--rule)}
    .item:last-of-type::before{display:none}
    .chk{flex:0 0 auto;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--control-line);background:var(--surface-2);padding:0;
      display:grid;place-items:center;margin-top:9px;position:relative;z-index:1}
    .chk svg{width:13px;height:13px;stroke:var(--on-accent);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
    .item.done .chk{background:var(--orange);border-color:var(--orange)}
    .item.done .chk svg{opacity:1}
    .card{flex:1;min-width:0;text-align:left;border:1px solid transparent;border-radius:8px;padding:9px 12px 8px;
      background:var(--surface-2);border-color:var(--line);display:block;width:100%}
    .card .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    .card .name{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
    .card .time{font-size:13px;font-weight:500;white-space:nowrap}
    .card .note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
    .card .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:10px;color:var(--ink-soft)}
    .card .lbl{display:flex;align-items:center;gap:5px}
    .card .by{color:var(--muted);font-style:italic;white-space:nowrap}
    .card .where{display:flex;align-items:flex-start;gap:4px;font-size:11px;color:var(--ink-soft);margin-top:4px;overflow-wrap:anywhere}
    .card .where svg{flex:0 0 auto;width:12px;height:12px;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .sugg{margin-top:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-3);box-shadow:var(--shadow-pop)}
    .sugg-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
      background:var(--surface-3);padding:10px 14px}
    .sugg-item:last-child{border-bottom:0}
    .sugg-item:active{background:var(--accent-wash)}
    .sugg-main{font-size:14px;font-weight:700;overflow-wrap:anywhere}
    .sugg-detail{font-size:12px;color:var(--muted)}
    .sugg-none{padding:12px 14px;font-size:13px;color:var(--muted)}
    .map-hint{font-size:12px;color:var(--muted);margin-top:8px}
    .map-box{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
    .map-box iframe{display:block;width:100%;height:170px;border:0;filter:var(--map-filter)}
    .dir-btn{display:block;text-align:center;text-decoration:none;color:var(--orange-dark);font-weight:800;font-size:13px;
      letter-spacing:.03em;text-transform:uppercase;padding:11px;border-top:1px solid var(--line);background:var(--surface-2)}
    .by-line{color:var(--muted);font-size:12px;text-align:center;margin-top:-10px}
    .card .lbl i{width:6px;height:6px;border-radius:50%;display:block}
    .item.done .name,.item.done .time{text-decoration:line-through}
    .item.done .card{opacity:.55}
    .empty{text-align:center;color:var(--yellow);font-weight:800;font-size:13.5px;margin-top:22px;letter-spacing:.01em}

    /* --- pulsante + ------------------------------------------------------ */
    .fab{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 26px);
      width:62px;height:62px;border-radius:50%;border:0;background:var(--orange);color:var(--on-accent);display:grid;place-items:center;
      box-shadow:var(--shadow)}
    .fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
    .fab:active{transform:translateX(-50%) scale(.95)}

    /* --- foglio "nuova attività" ---------------------------------------- */
    .sheet{position:absolute;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;overflow-y:auto;
      transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
    .sheet.open{transform:none;visibility:visible}
    .sheet::before{content:"";position:absolute;top:-220px;left:50%;margin-left:-190px;width:380px;height:380px;border-radius:50%;
      background:var(--deco);pointer-events:none}
    .sheet{scrollbar-width:none;-ms-overflow-style:none}   /* scorre comunque, ma senza barra visibile */
    .sheet::-webkit-scrollbar{display:none}
    .sheet > *{position:relative}
    /* "X" sempre visibile mentre il foglio scorre: wrapper sticky alto 0 (non occupa spazio) che fa da
       ancora al pulsante. Non uso position:fixed perché su desktop l'app è una card centrata. */
    .sheet > .close-wrap{position:sticky;top:0;height:0;z-index:5}
    .sheet .close{position:absolute;top:calc(env(safe-area-inset-top) + 28px);left:14px;width:44px;height:44px;
      background:var(--surface-3);box-shadow:var(--shadow-btn)}
    .sheet h2{margin:0;text-align:center;font-size:16px;letter-spacing:.05em;font-weight:700;
      padding:calc(env(safe-area-inset-top) + 80px) 0 28px}
    /* Il pulsante di invio sta sempre dove sta il "+" della home (centrato, a 34px dal fondo:
       il suo centro coincide con quello del FAB da 62px a 26px), anche se il form scorre. */
    .form{flex:1 0 auto;padding:0 30px 0;display:flex;flex-direction:column;gap:22px}
    .field label{display:block;color:var(--orange);font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}
    .field input,.field textarea{width:100%;border:0;border-bottom:1px solid var(--field-line);border-radius:0;background:transparent;
      padding:6px 0;font-size:15px;outline:none}
    .field input:focus,.field textarea:focus{border-bottom-color:var(--orange)}
    .field textarea{resize:none;min-height:80px;line-height:1.5}
    .two{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
    .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
    .chip{flex:0 0 calc((100% - 16px) / 3);justify-content:center;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13px}
    .chip i{width:9px;height:9px;border-radius:50%;display:block}
    .chip.on{border-color:var(--orange);background:var(--accent-wash);font-weight:700}
    .form-err{color:var(--danger);font-size:13px;text-align:center}
    .submit{align-self:center;border:0;border-radius:999px;background:var(--orange);color:var(--on-accent);font-weight:800;letter-spacing:.05em;
      padding:14px 44px;box-shadow:var(--shadow);margin-top:6px;text-transform:uppercase}
    /* Barra azioni fissa in basso: in modifica "Salva" a sinistra, "Aggiungi a Google Calendar" (tondo) al centro e "Elimina" (danger) a destra. */
    /* Fascia bianca a tutta larghezza dietro i pulsanti: ciò che scorre (etichette, mappa...) le passa sotto senza confondersi. */
    .actions{position:sticky;bottom:0;margin:auto -30px 0;padding:14px 30px calc(env(safe-area-inset-bottom) + 34px);background:var(--surface);
      box-shadow:var(--shadow-bar);z-index:2;display:flex;justify-content:center;gap:12px}
    .actions .submit{margin-top:0}
    .actions.two .submit{flex:1;padding-left:0;padding-right:0}
    .actions .del{background:var(--danger-fill);color:var(--on-danger);box-shadow:var(--shadow-danger)}
    .submit:disabled{opacity:.55}
    .gcal-btn{flex:0 0 auto;align-self:center;width:50px;height:50px;border-radius:50%;border:2px solid var(--orange);background:var(--surface-2);
      color:var(--orange-dark);display:grid;place-items:center;padding:0;box-shadow:var(--shadow)}
    .gcal-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* Campanella + logout: fissi in alto a destra, indipendenti dal padding di .top */
    .top-actions{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 34px);right:14px;display:flex;gap:4px}
    .top-actions .icon-btn{width:44px;height:44px}   /* target da 44px anche per campanella e logout */
    .ae-open{background:var(--peach)}

    /* --- calendario mensile (si apre dal click sulla data) ---------------------- */
    .date-line,.today{cursor:pointer}
    .cal{position:absolute;z-index:30;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;
      padding:calc(env(safe-area-inset-top) + 90px) 16px 16px}
    .cal-box{width:100%;max-width:360px;background:var(--surface-3);border-radius:20px;box-shadow:var(--shadow-pop-lg);padding:16px 14px 12px}
    .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .cal-title{font-weight:800;font-size:15px;text-transform:capitalize}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
    .cal-wd{font-size:11px;font-weight:700;color:var(--orange);padding:4px 0}
    .cal-d{border:0;background:transparent;border-radius:10px;height:40px;font-size:14px;font-weight:600;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px;padding:0}
    .cal-d.is-today{box-shadow:inset 0 0 0 1.5px var(--orange)}
    .cal-d.sel{background:var(--orange);color:var(--on-accent);box-shadow:var(--shadow)}
    .cal-d .dots{display:flex;gap:2px;height:5px}
    .cal-d .dots i{width:4px;height:4px;border-radius:50%;display:block}
    .cal-foot{display:flex;justify-content:space-between;margin-top:8px}
    .cal-foot button{border:0;background:transparent;color:var(--orange-dark);font-weight:800;font-size:13px;padding:8px 10px;text-transform:uppercase;letter-spacing:.03em}

    /* --- login ----------------------------------------------------------- */
    .login{position:absolute;inset:0;z-index:50;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:24px}
    .login-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;position:relative}
    .login-box .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 4px;display:block;box-shadow:var(--shadow)}
    .login-box h1{margin:0;text-align:center;font-size:26px;font-weight:800}
    .login-box h1 span{color:var(--orange)}
    .login-box p{margin:0 0 6px;text-align:center;color:var(--muted);font-size:13.5px}
    .login-err{color:var(--danger);font-size:13px;text-align:center}
    .pw-wrap{position:relative}
    .pw-wrap input{padding-right:36px}
    .pw-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;
      border:0;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer}
    .pw-toggle:hover,.pw-toggle[aria-pressed="true"]{color:var(--orange)}
    .pw-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .pw-toggle .eye-off{display:none}
    .pw-toggle[aria-pressed="true"] .eye{display:none}
    .pw-toggle[aria-pressed="true"] .eye-off{display:block}

    .toast{position:absolute;z-index:60;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--orange);color:var(--on-accent);font-weight:700;box-shadow:var(--shadow);
      font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:85%;text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    /* --- Æsir: assistente del calendario (overlay a tutto schermo, sotto lo sheet) ---------- */
    .sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    .aesir{position:absolute;inset:0 0 var(--kb,0px);z-index:18;background:var(--surface);display:flex;flex-direction:column;
      overflow:hidden;overflow:clip;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
    .aesir.open{transform:none;visibility:visible;transition:transform .25s ease}
    .aesir::before{content:"";position:absolute;top:-170px;right:-140px;width:360px;height:360px;border-radius:50%;
      background:var(--deco);pointer-events:none}
    .aesir > *{position:relative}

    .ae-head{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
    .ae-head .close{width:44px;height:44px;background:var(--surface-3);box-shadow:var(--shadow-btn)}
    .ae-title{margin:0;font-size:16px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    .ae-sub{margin:1px 0 0;font-size:12px;color:var(--ink-soft)}

    .ae-conv{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
      padding:8px 20px 20px;display:flex;flex-direction:column;gap:12px}
    .ae-live:empty,#aeExtra:empty{display:none}

    /* Fascia bianca come .actions dello sheet */
    .ae-compose{display:flex;align-items:flex-end;gap:10px;background:var(--surface-2);box-shadow:var(--shadow-bar);
      padding:10px 16px calc(env(safe-area-inset-bottom) + 14px)}
    .aesir.kb .ae-compose{padding-bottom:10px}
    .ae-input{flex:1;min-width:0}
    .ae-input textarea{display:block;width:100%;min-height:48px;max-height:132px;resize:none;border:1px solid var(--field-border);
      border-radius:14px;background:var(--field-bg);padding:12px 14px;font-size:16px;line-height:1.4;outline:none}   /* 16px: niente zoom su iOS */
    .ae-input textarea::placeholder{color:var(--muted)}
    .ae-input textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--focus-ring)}
    .ae-count{display:block;text-align:right;font-size:11px;color:var(--ink-soft);margin-top:3px}
    .ae-count.max{color:var(--ink);font-weight:700}

    .ae-send{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:0;background:var(--orange);color:var(--on-accent-ink);
      display:grid;place-items:center;padding:0;box-shadow:var(--shadow)}
    .ae-send svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .ae-send:disabled,.ae-send[aria-disabled="true"]{opacity:.55;box-shadow:none}
    .ae-send:active:not(:disabled){transform:scale(.95)}

    .aesir :focus-visible{outline:3px solid var(--orange-ink);outline-offset:2px}
    .ae-title:focus,.ae-conv:focus{outline:none}           /* focus programmatico, non da tastiera */

    /* stato vuoto */
    .ae-empty{margin:auto 0;display:flex;flex-direction:column;gap:18px;text-align:center;padding:12px 0}
    .ae-hello h3{margin:0;font-size:20px;font-weight:800}
    .ae-hello p{margin:6px auto 0;max-width:300px;color:var(--ink-soft);font-size:13.5px;line-height:1.5}
    .aesir.kb .ae-hello p{display:none}
    .chip.ask{flex:0 1 auto;min-height:44px;padding:10px 16px;font-size:14px;text-align:center;color:var(--ink)}
    .chip.ask:active{background:var(--accent-wash);border-color:var(--orange)}

    /* volto: quadratino arancione con due occhi, decorativo (lo stato vero lo dice il testo) */
    .ae-face{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:var(--orange);box-shadow:var(--shadow);
      display:flex;align-items:center;justify-content:center;gap:7px}
    .ae-eye{width:7px;height:11px;border-radius:4px;background:#fff;animation:ae-blink 5.6s infinite;
      transition:height .3s,transform .3s,border-radius .3s}
    .ae-face[data-mood="thinking"] .ae-eye{height:7px;animation:ae-scan 1.6s ease-in-out infinite}
    .ae-face[data-mood="done"] .ae-eye{animation:none;height:6px;background:transparent;border:2.5px solid #fff;border-bottom:0;
      border-radius:6px 6px 0 0}
    .ae-face[data-mood="error"] .ae-eye{animation:none;height:5px}
    .ae-face[data-mood="error"] .ae-eye:first-child{transform:rotate(-14deg)}
    .ae-face[data-mood="error"] .ae-eye:last-child{transform:rotate(14deg)}
    @keyframes ae-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    @keyframes ae-scan{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}

    .ae-q{align-self:flex-end;max-width:85%;margin:0;background:var(--peach);border-radius:14px 14px 4px 14px;
      padding:9px 13px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
    .ae-status{color:var(--ink-soft);font-size:14px}
    .ae-dots i{display:inline-block;width:5px;height:5px;margin-left:4px;border-radius:50%;background:var(--orange-ink);
      animation:ae-dot 1s ease-in-out infinite}
    .ae-dots i:nth-child(2){animation-delay:.15s}.ae-dots i:nth-child(3){animation-delay:.3s}
    @keyframes ae-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

    /* errori */
    .ae-err{background:var(--danger-wash);border:1px solid var(--danger-line);border-radius:14px;padding:12px 14px;
      font-size:14px;line-height:1.5}
    .ae-err small{display:block;margin-top:4px;font-size:11.5px;color:var(--ink-soft)}
    .ae-act{margin-top:10px;min-height:44px;padding:0 22px;border:2px solid var(--orange);border-radius:999px;background:var(--surface-2);
      color:var(--orange-ink);font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
    .ae-act:disabled{opacity:.55}

    /* risposta */
    .ae-answer{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:14px 16px;font-size:15px;line-height:1.55;
      overflow-wrap:anywhere}
    .ae-answer p{margin:0 0 10px}.ae-answer > :last-child{margin-bottom:0}
    .ae-answer ul,.ae-answer ol{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
    .ae-answer li::marker{color:var(--orange-ink);font-weight:700}

    .ae-cite{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
      padding:0 6px;margin:0 2px;border:1px solid var(--orange);border-radius:999px;background:var(--accent-wash);color:var(--ink);
      font-size:12px;font-weight:800;line-height:1;vertical-align:2px}
    .ae-cite::after{content:"";position:absolute;inset:-6px -3px}   /* area di tocco ~34px senza alterare la riga */

    .ae-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--ink-soft)}
    .ae-pill{background:var(--peach);color:var(--ink-soft);border-radius:999px;padding:3px 9px;font-weight:700;font-size:11.5px}

    /* fonti */
    .ae-src{border-top:1px solid var(--line);padding-top:4px}
    .ae-src summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;
      color:var(--orange-ink);font-weight:800;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
    .ae-src summary::-webkit-details-marker{display:none}
    .ae-src summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;
      transform:rotate(45deg);margin-top:-3px;transition:transform .2s}
    .ae-src[open] summary::after{transform:rotate(-135deg);margin-top:3px}
    .ae-src ol{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
    .ae-src-item{display:flex;gap:10px;align-items:flex-start;min-height:44px}
    .ae-src-item .ae-cite{flex:0 0 auto;margin:1px 0 0;vertical-align:0}
    .ae-src-item .ae-cite::after{display:none}
    .ae-src-body{flex:1;min-width:0;display:block}
    .ae-src-body .row,.ae-src-body .where{display:flex}
    .ae-src-date{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
    .ae-src-item[aria-busy="true"]{opacity:.6}

    @media (prefers-reduced-motion:reduce){
      .aesir,.aesir.open{transition:none}
      .ae-eye,.ae-dots i{animation:none!important;transition:none!important}
      .ae-dots i{opacity:.6}
      .ae-src summary::after{transition:none}
    }

    /* --- tema chiaro / scuro ------------------------------------------------- */
    /* Interruttore: l'icona mostra la destinazione (luna = vai al buio, sole = vai al chiaro) */
    :root[data-theme="dark"] .th-moon,
    :root:not([data-theme="dark"]) .th-sun{display:none}
    /* Al login l'interruttore resta raggiungibile sopra la schermata (gli altri pulsanti sono hidden) */
    .app.is-login .top-actions{z-index:51}

    /* Solo dark: anello di focus da tastiera in tutta l'app (nel light resta quello del browser).
       :where() tiene la specificita' bassa: i campi con outline:none e il loro indicatore proprio non cambiano. */
    :where(:root[data-theme="dark"]) :focus-visible{outline:3px solid var(--orange-ink);outline-offset:2px}
    :root[data-theme="dark"] ::selection{background:rgba(255,154,31,.35);color:var(--ink)}
    :root[data-theme="dark"] ::placeholder{color:var(--muted);opacity:1}
    :root[data-theme="dark"] input:-webkit-autofill{-webkit-text-fill-color:var(--ink);caret-color:var(--ink);
      box-shadow:0 0 0 1000px var(--surface) inset}

    /* Cross-fade breve solo al tocco dell'interruttore (classe messa e tolta da toggleTheme) */
    @media (prefers-reduced-motion:no-preference){
      :root.theme-anim, :root.theme-anim *, :root.theme-anim *::before, :root.theme-anim *::after{
        transition:background-color .2s ease,border-color .2s ease,color .2s ease !important}
    }

    /* Contrasto elevato richiesto dal sistema (solo dark: il light resta com'e') */
    @media (prefers-contrast:more){
      :root[data-theme="dark"]{--muted:#cdc4ba; --line:#6b625a; --field-line:#a39a90; --control-line:#a39a90}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div>
        <div class="date-line" id="dateLine"></div>
        <div class="today" id="dayTag"></div>
      </div>
    </header>
    <div class="top-actions">
      <button class="icon-btn ae-open" id="aesirBtn" type="button" aria-haspopup="dialog"
              aria-label="Chiedi ad Æsir, l'assistente del calendario" title="Æsir" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 3v4M17 5h4M5 17v4M3 19h4"/></svg>
      </button>
      <button class="icon-btn" id="bellBtn" aria-label="Attiva le notifiche" title="Notifiche" hidden>
        <svg id="bellOn" viewBox="0 0 24 24" hidden><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <svg id="bellOff" viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Passa al tema scuro" title="Passa al tema scuro">
        <svg class="th-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="th-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" aria-label="Esci" title="Esci" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>

    <div class="week-wrap">
      <button class="week-nav" id="prevWeek" aria-label="Settimana precedente"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="week" id="week"></div>
      <button class="week-nav" id="nextWeek" aria-label="Settimana successiva"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>

    <main class="list" id="list"></main>

    <button class="fab" id="fab" aria-label="Nuova attività"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

    <!-- Foglio nuova / modifica attività -->
    <section class="sheet" id="sheet" aria-hidden="true">
      <div class="close-wrap">
        <button class="icon-btn close" id="closeSheet" type="button" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <h2 id="sheetTitle">NUOVA ATTIVITÀ</h2>
      <form class="form" id="form" novalidate>
        <div class="by-line" id="byLine" hidden></div>
        <div class="field"><label for="fTitle">Nome attività</label><input id="fTitle" maxlength="200" placeholder="Es. Cena dai nonni" autocomplete="off"></div>
        <div class="two">
          <div class="field"><label for="fDate">Data</label><input id="fDate" type="date"></div>
          <div class="field"><label for="fTime">Ora</label><input id="fTime" type="time"></div>
        </div>
        <div class="field"><label for="fNote">Aggiungi nota</label><textarea id="fNote" maxlength="1000"></textarea></div>
        <div class="field">
          <label for="fAddr">Luogo</label>
          <input id="fAddr" maxlength="300" placeholder="Via, numero, città" autocomplete="street-address">
          <div class="sugg" id="sugg" hidden></div>
          <div class="map-hint" id="mapHint" hidden>Scegli un suggerimento dall'elenco per indicare il luogo esatto sulla mappa.</div>
          <div class="map-box" id="mapBox" hidden>
            <iframe id="mapFrame" title="Mappa" loading="lazy" referrerpolicy="no-referrer"></iframe>
            <a class="dir-btn" id="dirBtn" target="_blank" rel="noopener">Indicazioni</a>
          </div>
        </div>
        <div class="field"><label>Etichetta</label><div class="chips" id="chips"></div></div>
        <div class="form-err" id="formErr" hidden></div>
        <div class="actions" id="actions">
          <button class="submit" id="submitBtn" type="submit">Crea attività</button>
          <button class="gcal-btn" id="gcalBtn" type="button" aria-label="Aggiungi a Google Calendar" title="Aggiungi a Google Calendar" hidden>
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>
          </button>
          <button class="submit del" id="delBtn" type="button" hidden>Elimina</button>
        </div>
      </form>
    </section>

    <!-- Æsir: assistente del calendario (z-index 18: sotto lo sheet, così una fonte apre il dettaglio sopra la risposta) -->
    <section class="aesir" id="aesir" role="dialog" aria-modal="true" aria-labelledby="aeTitle">
      <header class="ae-head">
        <button class="icon-btn close" id="aeClose" type="button" aria-label="Chiudi e torna al calendario">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="ae-face" id="aeFace" data-mood="idle" aria-hidden="true"><span class="ae-eye"></span><span class="ae-eye"></span></div>
        <div class="ae-titles">
          <h2 class="ae-title" id="aeTitle" tabindex="-1">Æsir</h2>
          <p class="ae-sub">Assistente del calendario</p>
        </div>
      </header>

      <div class="ae-conv" id="aeConv" tabindex="-1">
        <div class="ae-empty" id="aeEmpty">
          <div class="ae-hello">
            <h3>Ciao, sono Æsir</h3>
            <p>Chiedimi degli eventi in calendario: cerco tra le attività e ti indico le fonti.</p>
          </div>
          <div class="chips ae-sugg" role="group" aria-label="Domande suggerite">
            <button class="chip ask" type="button">Quali sono i prossimi eventi?</button>
            <button class="chip ask" type="button">Cosa c'è questo fine settimana?</button>
            <button class="chip ask" type="button">Che attività ho questa settimana?</button>
            <button class="chip ask" type="button">Cosa c'è in programma domani?</button>
          </div>
        </div>
        <p class="ae-q" id="aeQEcho" hidden></p>
        <div class="ae-live" id="aeLive" aria-live="polite"></div>
        <div id="aeExtra"></div>
      </div>

      <form class="ae-compose" id="aeForm" novalidate>
        <div class="ae-input">
          <label for="aeQ" class="sr-only">Domanda per Æsir</label>
          <textarea id="aeQ" rows="1" maxlength="500" enterkeyhint="send" autocomplete="off"
                    placeholder="Chiedi qualcosa sul calendario…" aria-describedby="aeCount"></textarea>
          <span class="ae-count" id="aeCount" hidden></span>
        </div>
        <button class="ae-send" id="aeSend" type="submit" aria-label="Invia domanda" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </section>

    <!-- Login (identico nel funzionamento a ComitatoFeste: utente iniziale.cognome + password) -->
    <section class="login" id="login" hidden>
      <form class="login-box" id="loginForm">
        <img class="logo" src="/icon-192.png" alt="">
        <h1>Famil<span>y</span>Calendar</h1>
        <p>Accesso riservato alla famiglia.</p>
        <div class="field"><label for="lgUser">Utente</label><input id="lgUser" autocomplete="username" placeholder="es. g.lima" autocapitalize="none" spellcheck="false"></div>
        <div class="field"><label for="lgPass">Password</label>
          <div class="pw-wrap">
            <input id="lgPass" type="password" autocomplete="current-password">
            <button class="pw-toggle" id="lgToggle" type="button" aria-label="Mostra password" aria-pressed="false">
              <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <div class="login-err" id="lgErr" hidden></div>
        <button class="submit" id="lgBtn" type="submit">Entra</button>
      </form>
    </section>

    <div class="cal" id="cal" hidden>
      <div class="cal-box" role="dialog" aria-label="Scegli una data">
        <div class="cal-head">
          <button class="week-nav" id="calPrev" type="button" aria-label="Mese precedente"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          <span class="cal-title" id="calTitle"></span>
          <button class="week-nav" id="calNext" type="button" aria-label="Mese successivo"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot"><button id="calToday" type="button">Oggi</button><button id="calClose" type="button">Chiudi</button></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sr-only" id="themeLive" role="status" aria-live="polite"></div>
  </div>

  <script>
  (() => {
    const API = "";
    const MONTHS = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
    const WD_LONG = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
    const WD_SHORT = ["LUN","MAR","MER","GIO","VEN","SAB","DOM"];
    const $ = id => document.getElementById(id);

    // --- date helpers (giorni locali come stringhe yyyy-MM-dd, niente UTC) ---
    const pad = n => String(n).padStart(2, "0");
    const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
    const mondayOf = s => { const d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); };
    const todayStr = () => fmt(new Date());

    // --- stato ---------------------------------------------------------------
    let selected = todayStr();
    let labels = [];
    const cache = new Map();          // lunedì della settimana -> attività
    let editing = null;               // attività in modifica (null = nuova)
    let formLabel = null;
    let sheetReturn = null;           // pulsante (badge/fonte di Æsir) a cui restituire il focus alla chiusura dello sheet

    let token = null, user = null;
    try { token = localStorage.getItem("fc_token"); user = JSON.parse(localStorage.getItem("fc_user") || "null"); } catch (_) {}
    const store = (t, u) => {
      token = t; user = u;
      try {
        if (t) { localStorage.setItem("fc_token", t); localStorage.setItem("fc_user", JSON.stringify(u)); }
        else { localStorage.removeItem("fc_token"); localStorage.removeItem("fc_user"); }
      } catch (_) {}
    };

    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
    }

    async function api(path, opts = {}) {
      const r = await fetch(API + path, {
        ...opts,
        headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      });
      if (r.status === 401) { store(null, null); showLogin(); throw new Error("401"); }
      if (!r.ok) throw new Error((await r.text()).trim() || `Errore HTTP ${r.status}`);
      return r.status === 204 ? null : r.json();
    }

    // --- elementi DOM (testo sempre via textContent: niente HTML iniettato) ---
    function h(tag, props = {}, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === "class") e.className = v;
        else if (k === "style") e.style.cssText = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
      }
      for (const kid of kids) if (kid != null) e.append(kid);
      return e;
    }
    // --- tema chiaro / scuro: funzioni pure (testabili con Node, vedi i marker) ------------
    /* THEME-PURE-START */
    const THEMES = ["light", "dark"];
    const THEME_KEY = "fc_theme";
    const THEME_COLOR = { light: "#ffffff", dark: "#1c1916" };   // = --surface di ciascun tema
    const LABEL_SURFACE = { light: "#ffffff", dark: "#26221e" }; // = --surface-2 (fondo delle card)

    // stored: "light" | "dark" | null (nessuna scelta); systemDark: boolean
    function resolveTheme(stored, systemDark) {
      return THEMES.includes(stored) ? stored : (systemDark ? "dark" : "light");
    }
    function nextTheme(current) { return current === "dark" ? "light" : "dark"; }

    function readStored(storage) {
      try { const v = storage && storage.getItem(THEME_KEY); return THEMES.includes(v) ? v : null; }
      catch (_) { return null; }
    }
    function writeStored(storage, value) {
      try {
        if (THEMES.includes(value)) storage.setItem(THEME_KEY, value); else storage.removeItem(THEME_KEY);
        return true;
      } catch (_) { return false; }
    }

    // "#rgb" | "#rrggbb" -> [r,g,b] oppure null se non valido
    function parseHex(hex) {
      const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || "").trim());
      if (!m) return null;
      let s = m[1]; if (s.length === 3) s = [...s].map(c => c + c).join("");
      const n = parseInt(s, 16); return [n >> 16, (n >> 8) & 255, n & 255];

      const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
      return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);

    function contrast(a, b) {

    }
    // Testo leggibile su un fondo pieno del colore dato: inchiostro scuro o bianco, quello col contrasto maggiore.
    function contrastText(hex, dark = "#16181d", light = "#ffffff") {
      const rgb = parseHex(hex); if (!rgb) return dark;
      return contrast(parseHex(dark), rgb) >= contrast(parseHex(light), rgb) ? dark : light;
    }
    // Schiarisce (mescolando col bianco) finche' il colore ha almeno `min`:1 sul fondo `bg`.
    function ensureContrast(rgb, bg, min) {
      for (let i = 0; i <= 20; i++) {   // passi del 5%, interi: niente errori di arrotondamento
        const out = rgb.map(c => Math.round(c + (255 - c) * i / 20));
        if (contrast(out, bg) >= min) return out;
      }
      return [255, 255, 255];
    }
    // Stile di un'etichetta (card, puntini, chip) per il tema dato; valori pronti per style inline.
    // bg e' OPACO (gia' mescolato col fondo della card), cosi' non dipende da cio' che sta dietro.
    // light: identico a oggi (fondo = 16% del colore su bianco, bordo rgba .35, puntino = colore originale).
    // dark: colore base schiarito finche' fa 3:1 sul fondo card (#000 -> #737373), fondo 16% (10% se molto chiaro), bordo .45.
    function labelStyle(hex, theme) {
      const dark = theme === "dark", rgb = parseHex(hex);
      if (!rgb) return { dot: "var(--control-line)", bg: "", border: "" };   // senza etichetta: segue il tema da solo
      const card = parseHex(LABEL_SURFACE[dark ? "dark" : "light"]);
      const base = dark ? ensureContrast(rgb, card, 3) : rgb;
      const a = dark && luminance(base) > 0.5 ? .10 : .16;
      return { dot: toHex(base), bg: toHex(base.map((v, i) => v * a + card[i] * (1 - a))),
               border: `rgba(${base.join(",")},${dark ? .45 : .35})` };

    async function renderCal() {

    // --- Æsir: assistente del calendario (POST /api/assistant/ask) --------------------
    // Funzioni pure (nessun accesso a stato o rete): testabili isolatamente con uno script Node.
    /* AESIR-PURE-START */
    const AE_MAX = 500;
    const AE_TIMEOUT_MS = 60000;
    const CITE = /\[(\d{1,3}(?:\s*,\s*\d{1,3})*)\]/g;      // [1]  [1, 2]  ([1][2] = due corrispondenze)
    const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
    const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
    const asStr = v => typeof v === "string" ? v : "";

    // "Oggi" / "Domani" / "Venerdì 20 novembre" (anno solo se diverso da quello corrente)
    function fmtSrcDate(ds, now = new Date()) {
      if (!DATE_RE.test(String(ds))) return "";
      const today = fmt(now);
      if (ds === today) return "Oggi";
      if (ds === addDays(today, 1)) return "Domani";
      const d = parse(ds);
      return `${cap1(WD_LONG[d.getDay()])} ${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== now.getFullYear() ? " " + d.getFullYear() : ""}`;
    }

    // Retry-After: secondi (intero) oppure data HTTP. Restituisce secondi (>= 1) o null se assente/illeggibile.
    function parseRetryAfter(v, now = Date.now()) {
      if (v == null || String(v).trim() === "") return null;
      let sec = Number(v);
      if (!Number.isFinite(sec)) sec = (Date.parse(String(v)) - now) / 1000;
      if (!Number.isFinite(sec)) return null;
      return Math.max(1, Math.ceil(sec));
    }
    function fmtWait(sec) {
      if (sec < 60) return `${sec} ${sec === 1 ? "secondo" : "secondi"}`;
      const m = Math.ceil(sec / 60);
      return `${m} ${m === 1 ? "minuto" : "minuti"}`;
    }

    // Tabella errori della specifica. o = { kind: "offline"|"timeout" } oppure { kind: "http", status, message, retryAfter }.
    // Il `message` del server si mostra solo per il 400; altrove serve a distinguere i casi del 503.
    function aeError(o, now = Date.now()) {
      const E = (text, extra) => ({ text, small: "", retry: true, waitMs: 0, ...extra });
      if (o.kind === "offline") return E("Sei offline o il server non risponde. Controlla la connessione e riprova.");
      if (o.kind === "timeout") return E("La risposta sta impiegando troppo. Riprova tra poco.");
      const st = o.status, msg = asStr(o.message).trim();
      if (st === 400) return E(msg || "Domanda non valida: scrivi una domanda di al massimo 500 caratteri.", { retry: false });
      if (st === 429) {
        const sec = parseRetryAfter(o.retryAfter, now);
        if (sec == null) return E("Hai fatto molte domande di fila. Riprova tra qualche minuto.");
        return E(`Hai raggiunto il limite di domande. Riprova tra ${fmtWait(sec)}.`, { waitMs: sec <= 600 ? sec * 1000 : 0 });
      }
      if (st === 503) {
        if (/configurat/i.test(msg)) return E("Æsir non è ancora configurato su questo server. Chiedi a chi gestisce l'app di attivarlo.", { retry: false });
        if (!msg) return E("Æsir non è disponibile al momento. Riprova più tardi.");
        // 503 "transitori" del backend (occupato / modelli saturi / troppo lento): testo adatto e, se c'e' Retry-After,
        // stessa attesa del 429 (Riprova bloccato fino alla scadenza). Il message serve solo a distinguere i casi.
        const sec = parseRetryAfter(o.retryAfter, now), wait = sec == null ? {} : { waitMs: sec <= 600 ? sec * 1000 : 0 };
        const when = (dflt) => sec == null ? dflt : `tra ${fmtWait(sec)}`;
        if (/satur|quota/i.test(msg)) return E(`I modelli di Æsir sono momentaneamente saturi. Riprova ${when("tra qualche minuto")}.`, wait);
        if (/troppo tempo/i.test(msg)) return E(`Æsir sta impiegando troppo a rispondere. Riprova ${when("tra poco")}.`, wait);
        if (/occupat/i.test(msg)) return E(`Æsir è occupato con altre domande. Riprova ${when("tra qualche secondo")}.`, wait);
        return E(`Æsir è molto richiesto in questo momento. Riprova ${when("tra qualche secondo")}.`, wait);
      }
      return E("Non sono riuscito a preparare una risposta. Riprova tra poco.", { small: `Codice ${st}` });
    }

    // Normalizza il 200: answer obbligatoria (altrimenti null -> errore generico 502), sources opzionale.
    function aeParseResult(raw) {
      if (!raw || typeof raw.answer !== "string" || !raw.answer.trim()) return null;
      const byRef = new Map();
      for (const s of Array.isArray(raw.sources) ? raw.sources : []) {
        if (!s || !Number.isInteger(s.ref) || byRef.has(s.ref) || !DATE_RE.test(String(s.date))) continue;
        byRef.set(s.ref, { ref: s.ref, id: s.id, date: s.date, time: asStr(s.time), title: asStr(s.title), place: asStr(s.place) });
      }
      return { answer: raw.answer.trim(), sources: [...byRef.values()].sort((a, b) => a.ref - b.ref),
               reducedModel: raw.reducedModel === true, model: asStr(raw.model),
               retrieved: Number.isFinite(raw.retrieved) ? raw.retrieved : null };
    }

    // Testo -> DOM senza innerHTML: prima i **grassetti**, poi i badge di citazione dentro ogni pezzo.
    // Un [n] senza fonte corrispondente (anche uno solo in un [1, 9]) resta testo letterale.
    function aeInline(parent, text, byRef, mkCite) {
      String(text).split(/(\*\*[^*]+\*\*)/g).forEach(part => {
        if (!part) return;
        const bold = /^\*\*([^*]+)\*\*$/.exec(part);
        const target = bold ? parent.appendChild(h("strong")) : parent;
        const s = bold ? bold[1] : part;
        let last = 0;
        for (const m of s.matchAll(CITE)) {
          const refs = m[1].split(",").map(n => Number(n.trim()));
          if (!refs.every(n => byRef.has(n))) continue;
          if (m.index > last) target.append(s.slice(last, m.index));
          refs.forEach(n => target.append(mkCite(byRef.get(n))));
          last = m.index + m[0].length;
        }
        if (last < s.length) target.append(s.slice(last));
      });
    }
    // Formato: **grassetto**; righe "- " "* " "• " -> ul; "1. " "1) " -> ol; riga vuota = nuovo paragrafo;
    // righe consecutive nello stesso paragrafo separate da <br>.
    function formatAnswer(text, sources, mkCite) {
      const byRef = new Map(sources.map(s => [s.ref, s])), root = h("div", { class: "ae-answer" });
      let list = null, para = null;
      for (const raw of String(text).split("\n")) {
        const line = raw.trimEnd(), ul = /^\s*[-*•]\s+(.*)$/.exec(line), ol = /^\s*(\d{1,2})[.)]\s+(.*)$/.exec(line);
        if (ul || ol) {
          para = null;
          const tag = ul ? "ul" : "ol";
          if (!list || list.tagName.toLowerCase() !== tag) {
            list = root.appendChild(h(tag));
            if (ol && Number(ol[1]) > 1) list.setAttribute("start", ol[1]);   // elenco numerato interrotto: riparte dal suo numero
          }
          aeInline(list.appendChild(h("li")), ul ? ul[1] : ol[2], byRef, mkCite);
        } else if (!line.trim()) { para = list = null; }
        else {
          list = null;
          if (para) para.append(h("br")); else para = root.appendChild(h("p"));
          aeInline(para, line.trim(), byRef, mkCite);
        }
      }
      return root;
    }
    /* AESIR-PURE-END */

    const ae = { state: "idle", q: "", res: null, err: null, ctrl: null, req: 0, retryAt: 0,
                 retryTimer: null, slowTimer: null, act: null };
    const AE_INERT = ".top, .top-actions, .week-wrap, #list, #fab";   // la home sotto l'overlay
    const aeIsOpen = () => $("aesir").classList.contains("open");

    const citeBtn = s => h("button", { class: "ae-cite", type: "button",
      "aria-label": `Fonte ${s.ref}: ${s.title}, ${fmtSrcDate(s.date)}. Apri il dettaglio`, title: s.title,
      onclick: e => openSource(s, e.currentTarget) }, String(s.ref));

    function aeFit() {   // la casella cresce da sola fino a 132px
      const q = $("aeQ"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 132) + "px";
    }

    // Stato dei controlli: invio (disabled se vuota; aria-disabled mentre pensa o c'e' un'attesa 429, cosi' il focus non si perde),
    // contatore (da 400 caratteri) e pulsante "Riprova" (bloccato fino alla scadenza del 429).
    function aeSync() {
      const v = $("aeQ").value, n = v.length, send = $("aeSend");
      const busy = ae.state === "thinking" || Date.now() < ae.retryAt;
      send.disabled = !v.trim() && !busy;
      if (busy) send.setAttribute("aria-disabled", "true"); else send.removeAttribute("aria-disabled");
      const c = $("aeCount");
      c.hidden = n < 400; c.textContent = n >= 400 ? `${n}/${AE_MAX}` : ""; c.classList.toggle("max", n >= AE_MAX);
      if (ae.act) ae.act.disabled = Date.now() < ae.retryAt;
    }

    function aeSources(list) {
      const items = list.map(s => {
        const when = fmtSrcDate(s.date), pin = h("span");
        pin.innerHTML = PIN;
        return h("li", {}, h("button", { class: "card ae-src-item", type: "button",
            "aria-label": `Fonte ${s.ref}: ${[s.title, when, s.time, s.place].filter(Boolean).join(", ")}. Apri il dettaglio`,
            onclick: e => openSource(s, e.currentTarget) },
          h("span", { class: "ae-cite", "aria-hidden": "true" }, String(s.ref)),
          h("span", { class: "ae-src-body" },
            h("span", { class: "row" }, h("span", { class: "name" }, s.title), s.time ? h("span", { class: "time" }, s.time) : null),
            h("span", { class: "ae-src-date" }, when),
            s.place ? h("span", { class: "where" }, pin.firstChild, h("span", {}, s.place)) : null)));
      });
      return h("details", { class: "ae-src" }, h("summary", {}, `Fonti (${list.length})`), h("ol", {}, ...items));
    }

    // Disegna lo stato corrente (idle | thinking | done | error). Tutto via h()/textContent.
    function aeRender() {
      $("aeFace").dataset.mood = ae.state;
      $("aeEmpty").hidden = !(ae.state === "idle" && !ae.res);
      const echo = $("aeQEcho"), live = $("aeLive"), extra = $("aeExtra");
      echo.hidden = ae.state === "idle"; echo.textContent = ae.state === "idle" ? "" : ae.q;
      live.replaceChildren(); extra.replaceChildren(); ae.act = null;
      if (ae.state === "thinking") {
        live.append(h("div", { class: "ae-status" }, h("span", { class: "ae-status-text" }, "Sto consultando il calendario"),
          h("span", { class: "ae-dots", "aria-hidden": "true" }, h("i"), h("i"), h("i"))));
      } else if (ae.state === "done" && ae.res) {
        const r = ae.res;
        live.append(formatAnswer(r.answer, r.sources, citeBtn));
        const info = [r.model, r.retrieved != null ? `${r.retrieved} attività consultate` : ""].filter(Boolean).join(" · ");
        if (r.reducedModel) extra.append(h("div", { class: "ae-meta", title: info },
          h("span", { class: "ae-pill",
            "aria-label": "Risposta generata con il modello di riserva, potrebbe essere meno precisa" }, "Modello di riserva")));
        if (r.sources.length) extra.append(aeSources(r.sources));
      } else if (ae.state === "error" && ae.err) {
        const box = h("div", { class: "ae-err" }, h("span", {}, ae.err.text), ae.err.small ? h("small", {}, ae.err.small) : null);
        if (ae.err.retry) {
          ae.act = h("button", { class: "ae-act", type: "button", onclick: () => ask(ae.q) }, "Riprova");
          box.append(ae.act);
        }
        live.append(box);
      }
      aeSync();
    }

    function aeFinish(my, o) {
      if (my !== ae.req || o.kind === "aborted") return;   // risposta vecchia (chiusura o nuova domanda): scartata
      clearTimeout(ae.slowTimer); ae.ctrl = null;
      if (o.kind === "http" && o.status === 401) {
        store(null, null);
        showLogin();   // chiude Æsir e azzera la conversazione
        $("lgErr").textContent = "Sessione scaduta: accedi di nuovo."; $("lgErr").hidden = false;
        return;
      }
      let res = null;
      if (o.kind === "ok") {
        res = aeParseResult(o.res);
        if (!res) o = { kind: "http", status: 502, message: "", retryAfter: null };   // 200 senza answer: errore generico
      }
      if (res) { ae.state = "done"; ae.res = res; ae.err = null; }
      else {
        ae.state = "error"; ae.res = null; ae.err = aeError(o);
        if (ae.err.waitMs) {
          ae.retryAt = Date.now() + ae.err.waitMs;
          clearTimeout(ae.retryTimer); ae.retryTimer = setTimeout(aeSync, ae.err.waitMs + 30);
        }
        if (!$("aeQ").value.trim()) { $("aeQ").value = ae.q; aeFit(); }   // la domanda si puo' correggere
      }
      aeRender();
      if (res) {   // si legge dall'inizio: scorre solo .ae-conv (il metodo di scorrimento del browser potrebbe muovere anche gli antenati)
        const conv = $("aeConv");
        conv.scrollTop = Math.max(0, $("aeQEcho").offsetTop - 8);
      }
    }

    async function ask(question) {
      const q = (question || "").trim().slice(0, AE_MAX);
      if (!q || ae.state === "thinking" || Date.now() < ae.retryAt) return;
      const box = $("aeQ");
      if (box.value.trim().slice(0, AE_MAX) === q) { box.value = ""; aeFit(); }
      const my = ++ae.req;
      ae.q = q; ae.state = "thinking"; ae.res = ae.err = null;
      clearTimeout(ae.slowTimer);
      ae.slowTimer = setTimeout(() => {   // dopo 8 s: un solo cambio di testo (annunciato una volta)
        const t = my === ae.req && ae.state === "thinking" && $("aeLive").querySelector(".ae-status-text");
        if (t) t.textContent = "Ci sto mettendo un po', ancora un attimo";
      }, 8000);
      aeRender();
      const coarse = matchMedia("(pointer:coarse)").matches;
      if (coarse) box.blur();   // chiude la tastiera: la risposta ha tutto lo schermo
      if (coarse || document.activeElement !== box) $("aeConv").focus({ preventScroll: true });
      if (!navigator.onLine) return aeFinish(my, { kind: "offline" });
      const ctrl = ae.ctrl = new AbortController();
      let timedOut = false;
      // Invariante: timeout del client (60 s) > attesa slot del server (5 s) + Deadline (50 s). Se il backend
      // allunga uno dei due, alzare anche questo, altrimenti il client abbandona risposte che sarebbero arrivate.
      const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, AE_TIMEOUT_MS);
      try {
        const r = await fetch(`${API}/api/assistant/ask`, { method: "POST", signal: ctrl.signal,
          headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          body: JSON.stringify({ question: q }) });
        if (r.ok) {
          let res = null;
          try { res = await r.json(); } catch (e) { if (ctrl.signal.aborted) throw e; }
          return aeFinish(my, { kind: "ok", res });
        }
        let message = "";
        try { const j = await r.json(); if (typeof j?.message === "string") message = j.message; } catch (e) { if (ctrl.signal.aborted) throw e; }
        aeFinish(my, { kind: "http", status: r.status, message, retryAfter: r.headers.get("Retry-After") });
      } catch (_) {
        aeFinish(my, { kind: timedOut ? "timeout" : ctrl.signal.aborted ? "aborted" : "offline" });
      } finally { clearTimeout(timer); }
    }

    // Badge e fonti: l'attivita' si recupera dalla cache settimanale (come la home) e si apre lo sheet SOPRA Æsir.
    async function openSource(s, btn) {
      if (btn.getAttribute("aria-busy") === "true") return;
      const mon = mondayOf(s.date);
      btn.setAttribute("aria-busy", "true");
      try { if (!cache.has(mon)) cache.set(mon, await api(`/api/tasks?from=${mon}&to=${addDays(mon, 6)}`)); }
      catch (e) { if (e.message !== "401") toast("Impossibile aprire l'attività."); return; }
      finally { btn.removeAttribute("aria-busy"); }
      const t = cache.get(mon).find(x => x.id === s.id);
      if (!t) { toast("Questa attività non esiste più."); return; }
      // Lo sheet (fratello dell'overlay) sta SOPRA Æsir: l'overlay diventa inert, cosi' lettori di schermo e Tab
      // restano nello sheet. closeSheet() lo ripristina.
      $("aesir").inert = true;
      sheetReturn = btn; openSheet(t);
      $("closeSheet").focus({ preventScroll: true });
    }

    // Cintura e bretelle: .app non deve mai restare scorsa (overflow:clip lo impedisce, ma il costo del controllo e' nullo).
    function aeUnscroll() {
      const a = $("app");
      if (a.scrollTop) a.scrollTop = 0;
      if (a.scrollLeft) a.scrollLeft = 0;
    }

    function openAesir() {
      if (aeIsOpen()) return;
      $("aesir").classList.add("open");
      aeUnscroll();
      document.querySelectorAll(AE_INERT).forEach(el => { el.inert = true; });   // Tab e lettori di schermo restano nell'overlay
      aeRender();
      setTimeout(() => {   // dopo la transizione; sul telefono non si apre la tastiera da sola
        if (!aeIsOpen()) return;
        if (matchMedia("(hover:hover) and (pointer:fine)").matches) $("aeQ").focus({ preventScroll: true }); else $("aeTitle").focus({ preventScroll: true });
        aeUnscroll();
      }, 260);
    }
    function closeAesir() {
      if (!aeIsOpen()) return;
      if (ae.state === "thinking") {   // si smette di aspettare: la domanda resta nella casella
        ae.req++; ae.ctrl?.abort(); ae.ctrl = null; clearTimeout(ae.slowTimer);
        ae.state = "idle";
        if (!$("aeQ").value.trim()) { $("aeQ").value = ae.q; aeFit(); }
        aeRender();
      }
      const el = $("aesir");
      el.classList.remove("open", "kb"); el.style.setProperty("--kb", "0px"); el.inert = false;
      document.querySelectorAll(AE_INERT).forEach(e => { e.inert = false; });
      sheetReturn = null;
      if ($("login").hidden) $("aesirBtn").focus({ preventScroll: true });
      aeUnscroll();
    }
    // Logout / sessione scaduta: chiude e dimentica tutto.
    function aeReset() {
      closeAesir();
      ae.req++; ae.ctrl?.abort(); ae.ctrl = null;
      clearTimeout(ae.slowTimer); clearTimeout(ae.retryTimer);
      Object.assign(ae, { state: "idle", q: "", res: null, err: null, retryAt: 0 });
      $("aeQ").value = ""; aeFit(); aeRender();
    }

    // Tastiera mobile: Chrome Android >=108 e iOS non ridimensionano il layout viewport, quindi si alza il fondo
    // dell'overlay di quanto e' alta la tastiera (--kb). Se il browser ridimensiona davvero, kb vale 0.
    function syncKb() {
      const vv = window.visualViewport, el = $("aesir");
      if (!vv || !aeIsOpen()) return;
      aeUnscroll();
      const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop), on = kb > 80;
      el.style.setProperty("--kb", on ? kb + "px" : "0px");
      el.classList.toggle("kb", on);
      if (vv.offsetTop > 0 || scrollY) scrollTo(0, 0);   // iOS sposta la pagina: la riportiamo in cima
    }
    window.visualViewport?.addEventListener("resize", syncKb);
    window.visualViewport?.addEventListener("scroll", syncKb);
    $("aeQ").addEventListener("focus", () => [0, 150, 350].forEach(ms => setTimeout(syncKb, ms)));

    $("aesirBtn").onclick = openAesir;
    $("aeClose").onclick = closeAesir;
    $("aesir").addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").classList.contains("open")) closeAesir(); });
    $("aeForm").addEventListener("submit", e => { e.preventDefault(); ask($("aeQ").value); });
    $("aeQ").addEventListener("input", () => { aeFit(); aeSync(); });
    $("aeQ").addEventListener("keydown", e => {   // Invio invia, Maiusc+Invio va a capo
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); ask($("aeQ").value); }
    });
    document.querySelectorAll(".chip.ask").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
    aeRender();

    // --- tema chiaro / scuro: controller --------------------------------------------
    // La scelta salvata vince; senza scelta si segue il sistema (anche quando cambia mentre l'app e' aperta).
    const themeStore = (() => { try { return window.localStorage; } catch (_) { return null; } })();
    const mqDark = matchMedia("(prefers-color-scheme: dark)");
    let themeChoice = readStored(themeStore);   // in memoria: vale anche se lo storage non salva

    function applyTheme(theme, announce = false) {
      const changed = curTheme() !== theme;
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", THEME_COLOR[theme]);
      const label = theme === "dark" ? "Passa al tema chiaro" : "Passa al tema scuro";
      $("themeBtn").setAttribute("aria-label", label); $("themeBtn").title = label;
      if (announce) $("themeLive").textContent = theme === "dark" ? "Tema scuro attivo" : "Tema chiaro attivo";
      if (!changed) return;
      renderWeek(); renderList();                               // i colori delle etichette dipendono dal tema
      if ($("sheet").classList.contains("open")) renderChips();
      if (!$("cal").hidden) renderCal();
    }

    function toggleTheme() {
      const next = nextTheme(curTheme());
      themeChoice = next; writeStored(themeStore, next);
      const root = document.documentElement;
      root.classList.add("theme-anim");                         // il CSS la usa solo senza reduced-motion
      clearTimeout(toggleTheme.t); toggleTheme.t = setTimeout(() => root.classList.remove("theme-anim"), 300);
      applyTheme(next, true);
    }

    const onSystemTheme = () => { if (themeChoice === null) applyTheme(mqDark.matches ? "dark" : "light"); };
    if (mqDark.addEventListener) mqDark.addEventListener("change", onSystemTheme); else mqDark.addListener(onSystemTheme);
    addEventListener("storage", e => {                          // scelta fatta in un'altra scheda
      if (e.key !== THEME_KEY && e.key !== null) return;
      themeChoice = readStored(themeStore); applyTheme(resolveTheme(themeChoice, mqDark.matches));
    });
    $("themeBtn").onclick = toggleTheme;
    applyTheme(resolveTheme(themeChoice, mqDark.matches));      // allinea etichetta e meta allo script in <head>

    // --- login ---------------------------------------------------------------
    function showLogin() {
      $("app").classList.add("is-login");   // l'interruttore tema resta sopra la schermata di accesso
      $("login").hidden = false; $("bellBtn").hidden = $("logoutBtn").hidden = $("aesirBtn").hidden = true;
      aeReset();   // chiude Æsir e dimentica domanda/risposta: non devono restare visibili a un altro utente
      $("lgUser").focus();
    }
    function hideLogin() { $("app").classList.remove("is-login"); $("login").hidden = true; $("bellBtn").hidden = $("logoutBtn").hidden = $("aesirBtn").hidden = false; }

    $("logoutBtn").onclick = () => { store(null, null); cache.clear(); showLogin(); };

    // --- campanella: attiva / disattiva le notifiche push --------------------------
    const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    const b64ToU8 = b64 => {
      const pad = "=".repeat((4 - b64.length % 4) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, c => c.charCodeAt(0));
    };
    const saveSub = sub => {
      const j = sub.toJSON();
      return api("/api/push/subscribe", { method: "POST", body: JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }) });
    };

    // Pallino arancione = notifiche attive su questo dispositivo. Se il browser è già
    // sottoscritto riallinea il server (idempotente: copre DB azzerato o cambio utente).
    async function refreshBell() {
      let on = false;
      if (pushSupported && Notification.permission === "granted") {
        try {
          const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
          if (sub) { on = true; if (token) saveSub(sub).catch(() => {}); }
        } catch (_) {}
      }
      // toggleAttribute: la proprietà .hidden non esiste sugli elementi SVG
      $("bellOn").toggleAttribute("hidden", !on);
      $("bellOff").toggleAttribute("hidden", on);
      $("bellBtn").setAttribute("aria-label", on ? "Disattiva le notifiche" : "Attiva le notifiche");
    }

    $("bellBtn").onclick = async () => {
      if (!pushSupported) { toast("Notifiche non supportate qui. Su iPhone installa prima l'app."); return; }
      const btn = $("bellBtn"); btn.disabled = true;
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          await api("/api/push/unsubscribe", { method: "POST", body: JSON.stringify({ endpoint: sub.endpoint }) });
          await sub.unsubscribe();
          toast("Notifiche disattivate");
        } else {
          let key;
          try { key = (await api("/api/push/key")).publicKey; }
          catch (e) { if (e.message === "401") return; toast("Notifiche non configurate sul server."); return; }
          if (await Notification.requestPermission() !== "granted") { toast("Permesso negato: abilita le notifiche dalle impostazioni del browser."); return; }
          await saveSub(await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) }));
          toast("Notifiche attivate");
        }
      } catch (e) {
        if (e.message !== "401") toast("Impossibile modificare le notifiche.");
      } finally { btn.disabled = false; refreshBell(); }
    };

    function setPassVisible(show) {
      $("lgPass").type = show ? "text" : "password";
      const t = $("lgToggle");
      t.setAttribute("aria-pressed", show);
      t.setAttribute("aria-label", show ? "Nascondi password" : "Mostra password");
    }
    $("lgToggle").onclick = () => setPassVisible($("lgPass").type === "password");

    $("loginForm").onsubmit = async e => {
      e.preventDefault();
      const btn = $("lgBtn"), err = $("lgErr");
      err.hidden = true; btn.disabled = true;
      try {
        const r = await fetch(`${API}/api/auth/login`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: $("lgUser").value.trim(), password: $("lgPass").value }),
        });
        if (!r.ok) {
          err.textContent = r.status === 401 ? "Utente o password non validi." : `Errore: HTTP ${r.status}`;
          err.hidden = false; return;
        }
        const d = await r.json();
        store(d.token, { username: d.username, memberId: d.memberId, displayName: d.displayName, role: d.role });
        $("lgPass").value = ""; setPassVisible(false);
        hideLogin(); start(); refreshBell();
      } catch (_) {
        err.textContent = "Server non raggiungibile."; err.hidden = false;
      } finally { btn.disabled = false; }
    };

    async function start() {
      try { labels = await api("/api/labels"); } catch (_) {}
      await loadWeek(true);
    }

    (async () => {
      renderAll();
      let enabled = true;
      try { const r = await fetch(`${API}/api/auth/status`); if (r.ok) enabled = (await r.json()).enabled; } catch (_) {}
      if (enabled && !token) showLogin();
      else { if (enabled) hideLogin(); else $("bellBtn").hidden = $("aesirBtn").hidden = false; start(); refreshBell(); }
    })();

    // Riallinea "oggi" se l'app resta aperta a cavallo della mezzanotte / torna in primo piano.
    let lastDay = todayStr();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      const t = todayStr();
      if (t !== lastDay) { if (selected === lastDay) selected = t; lastDay = t; }
      if (token || $("login").hidden) loadWeek(true);
    });

    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  })();
  </script>
</body>
</html>
